# TRUSTGRAPH — Render Blueprint (FREE plan)
#
# Three independently deployable backends. The console (frontend/, Module 4 UI)
# stays on Vercel; the Module 4 AI Security Analyst API is part of backend/
# (router mounted in backend/app/main.py), so it has no service of its own.
#
#   Vercel console ──► trustgraph-module1  (module1/, Next.js 16 + Prisma 7 + SQLite)
#                 ──► trustgraph-module3  (module3/, FastAPI entity & evidence store, SQLite)
#                 ──► trustgraph-module2  (backend/, FastAPI risk engine + AI analyst, SQLite)
#   trustgraph-module2 ──► module1 (brand DNA via /api/brands) and module3 (entities/evidence)
#
# FREE PLAN LIMITS (by choice — no payment):
#  - No persistent disks: each SQLite file lives on the service's temporary filesystem
#    and is recreated empty whenever the service restarts, redeploys or wakes from sleep.
#  - Services sleep after ~15 min without traffic; the first request then takes ~1 min.
#  - To keep the demo usable after every wake-up, Module 1 reloads its labelled demo
#    brands + sample scans and Module 3 reloads its labelled SYNTHETIC test entity at start.
#    Anything users create (brands, analyses, verdicts) is temporary.
# To make data permanent later: plan: starter + a `disk:` per service (see docs/DEPLOYMENT.md).

services:
  # ---------------------------------------------------------------- Module 1
  - type: web
    name: trustgraph-module1
    runtime: node
    rootDir: module1
    region: oregon
    plan: free
    # postinstall runs `prisma generate`; devDependencies (prisma CLI, tsx) stay
    # installed because NODE_ENV is not forced to production at install time.
    buildCommand: npm ci && npm run build
    # Fresh database each boot → create schema, load demo brands/sample scans, serve.
    startCommand: npx prisma db push && npm run db:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: INTEL_MODE
        value: demo
      - key: SCAN_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------------------------- Module 3
  - type: web
    name: trustgraph-module3
    runtime: python
    rootDir: module3
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    # Fresh database each boot → migrate, load the labelled SYNTHETIC fixture
    # (Acme Corp Support + 4 evidence items) for the demo tenant, serve.
    startCommand: alembic upgrade head && python -m module3.seed 11111111-2222-3333-4444-555555555555 && uvicorn module3.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRUSTGRAPH_M3_ENVIRONMENT
        value: production
      - key: TRUSTGRAPH_M3_LOG_LEVEL
        value: INFO
      - key: TRUSTGRAPH_M3_DATABASE_URL
        value: sqlite:///./module3.db

  # ------------------------------------------- Module 2 (+ Module 4 analyst API)
  - type: web
    name: trustgraph-module2
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    # Single uvicorn worker: jobs run in-process (TRUSTGRAPH_WORKER_MODE=in_process).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRUSTGRAPH_ENVIRONMENT
        value: production
      - key: TRUSTGRAPH_LOG_LEVEL
        value: INFO
      - key: TRUSTGRAPH_DATABASE_URL
        value: sqlite:///./trustgraph_module2.db
      - key: TRUSTGRAPH_WORKER_MODE
        value: in_process
      - key: TRUSTGRAPH_TEXT_MODEL
        value: char_ngram_tfidf
      - key: TRUSTGRAPH_VISUAL_MODEL
        value: phash_hamming
      - key: TRUSTGRAPH_IDENTITY_MODEL
        value: token_similarity
      # Public URLs of the two services above (Render's default address for each
      # service name; no trailing slash). If Render shows a different URL on a
      # service page (name already taken), change it here AND in frontend/vercel.json.
      # With TRUSTGRAPH_ENVIRONMENT=production, /readyz returns 503 if either is
      # blank, so the deploy fails instead of silently using MOCK adapters.
      - key: TRUSTGRAPH_MODULE1_BASE_URL
        value: https://trustgraph-module1.onrender.com
      - key: TRUSTGRAPH_MODULE3_BASE_URL
        value: https://trustgraph-module3.onrender.com
      # Free services sleep; give a sleeping Module 1/3 time to wake (default 10 s).
      - key: TRUSTGRAPH_INTEGRATION_HTTP_TIMEOUT_SECONDS
        value: "60"
      # AI Security Analyst (Module 4) — same variable names as Module 1.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Optional: web-search discovery provider (Brave Search API).
      - key: TRUSTGRAPH_DISCOVERY_SEARCH_API_KEY
        sync: false
