# TRUSTGRAPH — Render Blueprint
#
# Three independently deployable backends. The console (frontend/, Module 4 UI)
# stays on Vercel; the Module 4 AI Security Analyst API is part of backend/
# (router mounted in backend/app/main.py), so it has no service of its own.
#
#   Vercel console ──► trustgraph-module1  (module1/, Next.js 16 + Prisma 7 + SQLite)
#                 ──► trustgraph-module2  (backend/, FastAPI risk engine + AI analyst, SQLite)
#                 ──► trustgraph-module3  (module3/, FastAPI entity & evidence store, SQLite)
#   trustgraph-module2 ──► module1 (brand DNA via /api/brands) and module3 (entities/evidence)
#
# Every service stores SQLite on a persistent disk mounted at /var/data. Render disks
# are not available during build, so schema setup (prisma db push / alembic upgrade
# head) runs at the start of each boot; both are idempotent and non-destructive.
# Disks require a paid instance type and pin each service to one instance, which
# SQLite and Module 2's in-process job worker need anyway.

services:
  # ---------------------------------------------------------------- Module 1
  - type: web
    name: trustgraph-module1
    runtime: node
    rootDir: module1
    region: oregon
    plan: starter
    # postinstall runs `prisma generate`; devDependencies (prisma CLI) are kept
    # because NODE_ENV is not forced to production at install time.
    buildCommand: npm ci && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /api/health
    disk:
      name: module1-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/sentinel.db
      - key: INTEL_MODE
        value: demo
      - key: SCAN_RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------------------------- Module 3
  - type: web
    name: trustgraph-module3
    runtime: python
    rootDir: module3
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: alembic upgrade head && uvicorn module3.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: module3-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRUSTGRAPH_M3_ENVIRONMENT
        value: production
      - key: TRUSTGRAPH_M3_LOG_LEVEL
        value: INFO
      - key: TRUSTGRAPH_M3_DATABASE_URL
        value: sqlite:////var/data/module3.db

  # ------------------------------------------- Module 2 (+ Module 4 analyst API)
  - type: web
    name: trustgraph-module2
    runtime: python
    rootDir: backend
    region: oregon
    plan: starter
    buildCommand: pip install --upgrade pip && pip install .
    # Single uvicorn worker: jobs run in-process (TRUSTGRAPH_WORKER_MODE=in_process).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    disk:
      name: module2-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: TRUSTGRAPH_ENVIRONMENT
        value: production
      - key: TRUSTGRAPH_LOG_LEVEL
        value: INFO
      - key: TRUSTGRAPH_DATABASE_URL
        value: sqlite:////var/data/trustgraph_module2.db
      - key: TRUSTGRAPH_WORKER_MODE
        value: in_process
      - key: TRUSTGRAPH_TEXT_MODEL
        value: char_ngram_tfidf
      - key: TRUSTGRAPH_VISUAL_MODEL
        value: phash_hamming
      - key: TRUSTGRAPH_IDENTITY_MODEL
        value: token_similarity
      # Public URLs of the two services above (Render's default address for each
      # service name; no trailing slash). If Render shows a different URL on a
      # service page (name already taken), change it here AND in frontend/vercel.json.
      # With TRUSTGRAPH_ENVIRONMENT=production, /readyz returns 503 if either is
      # blank, so the deploy fails instead of silently using MOCK adapters.
      - key: TRUSTGRAPH_MODULE1_BASE_URL
        value: https://trustgraph-module1.onrender.com
      - key: TRUSTGRAPH_MODULE3_BASE_URL
        value: https://trustgraph-module3.onrender.com
      # AI Security Analyst (Module 4) — same variable names as Module 1.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # Optional: web-search discovery provider (Brave Search API).
      - key: TRUSTGRAPH_DISCOVERY_SEARCH_API_KEY
        sync: false
